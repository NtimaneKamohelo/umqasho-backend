services:
  postgres:
    image: postgres:18.6
    container_name: umqasho-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: umqasho
      POSTGRES_USER: umqasho
      POSTGRES_PASSWORD: umqasho

    ports:
      - "5432:5432"

    volumes:
      - umqasho-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U umqasho -d umqasho"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umqasho-postgres-data: