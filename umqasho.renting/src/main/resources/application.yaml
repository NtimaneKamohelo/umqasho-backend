spring:
  application:
    name: umqasho.renting

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/umqasho}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ntimane200}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics

  endpoint:
    health:
      probes:
        enabled: true

umqasho:

  security:

    firebase:
      enabled: ${FIREBASE_ENABLED:true}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

  invitations:
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:48}

logging:
  level:
    root: INFO
    za.co.umqasho.renting: INFO


